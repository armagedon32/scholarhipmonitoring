{% extends "base.html" %}
{% block title %}Apply for Scholarship{% endblock %}
{% block content %}
<h1 class="page-title">Scholarship Application</h1>
<div class="card card-narrow">
  <div id="eligibility-banner" class="flash" hidden></div>
  <form method="post" class="form">
    <label>Scholarship Program
      <select name="scholarship_id" required>
        {% for s in scholarships %}
        <option value="{{ s.id }}"
                {% if s.gwa_threshold is not none %}data-gwa-threshold="{{ s.gwa_threshold }}"{% endif %}
                {% if s.max_failed_subjects is not none %}data-max-failed="{{ s.max_failed_subjects }}"{% endif %}
                {% if not s.window_open %}data-window-closed="1"{% endif %}>{{ s.name }} ({{ s.code }}){% if not s.window_open %} — {{ s.window_msg }}{% endif %}</option>
        {% endfor %}
      </select>
    </label>
    <div class="form-row">
      <label>GWA (1.00 best - 5.00)
        <input type="number" name="gwa" step="0.01" min="1" max="5" required>
      </label>
      <label>Failed Subjects
        <input type="number" name="failed_subjects" min="0" max="20" value="0" required>
      </label>
    </div>
    <div class="form-row">
      <label>Units Enrolled
        <input type="number" name="units_enrolled" min="1" max="45" required>
      </label>
      <label>Attendance Rate (%)
        <input type="number" name="attendance_rate" step="0.1" min="0" max="100" required>
      </label>
    </div>
    <div class="form-row">
      <label>Socioeconomic Status
        <select name="socio_status" required>
          <option>Low</option><option>Lower-Middle</option><option>Middle</option><option>Upper-Middle</option>
        </select>
      </label>
      <label>Annual Family Income (&pesos;)
        <input type="number" name="annual_income" step="0.01" min="0" required placeholder="250000">
      </label>
    </div>
    <label>Documentary Requirements (filenames, comma-separated)
      <input type="text" name="documents" placeholder="Grade_Report.pdf, Good_Moral.pdf">
    </label>
    <label>Upload Documents
      <input type="file" name="document_uploads" multiple
             accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.xls,.xlsx">
    </label>
    <button class="btn btn-primary btn-block" type="submit">Submit Application</button>
  </form>
</div>

<script>
(function () {
  var sel = document.querySelector('select[name="scholarship_id"]');
  var gwa = document.querySelector('input[name="gwa"]');
  var failed = document.querySelector('input[name="failed_subjects"]');
  var banner = document.getElementById('eligibility-banner');
  var btn = document.querySelector('button[type="submit"]');

  function check() {
    var opt = sel.selectedOptions[0];
    if (!opt) return;
    if (opt.dataset.windowClosed !== undefined && opt.dataset.windowClosed !== '') {
      banner.hidden = false;
      banner.className = 'flash flash-error';
      banner.textContent = opt.text.replace(/ \u2014 .*$/, '') + ': applications are currently closed.';
      btn.disabled = true;
      return;
    }
    var hasGwa = opt.dataset.gwaThreshold !== undefined && opt.dataset.gwaThreshold !== '';
    var hasFailed = opt.dataset.maxFailed !== undefined && opt.dataset.maxFailed !== '';
    var g = parseFloat(gwa.value);
    var f = parseInt(failed.value, 10);
    if (!hasGwa && !hasFailed) {
      banner.hidden = false;
      banner.className = 'flash flash-success';
      banner.textContent = 'You are eligible for ' + opt.text + '. No academic grade requirement applies.';
      btn.disabled = false;
      return;
    }
    if (isNaN(g) || (hasFailed && isNaN(f))) {
      banner.hidden = true;
      btn.disabled = false;
      return;
    }
    var reqs = [];
    var pass = true;
    if (hasGwa) {
      var threshold = parseFloat(opt.dataset.gwaThreshold);
      reqs.push('GWA \u2264 ' + threshold);
      if (!(g <= threshold)) pass = false;
    }
    if (hasFailed) {
      var maxFailed = parseInt(opt.dataset.maxFailed, 10);
      reqs.push('max ' + maxFailed + ' failed subject(s)');
      if (!(f <= maxFailed)) pass = false;
    }
    if (pass) {
      banner.hidden = false;
      banner.className = 'flash flash-success';
      banner.textContent = 'You are eligible for ' + opt.text + '. You may submit your application.';
      btn.disabled = false;
    } else {
      banner.hidden = false;
      banner.className = 'flash flash-error';
      banner.textContent = 'Not eligible for ' + opt.text + '. Requirement: ' + reqs.join(' and ') + '. You cannot apply for this scholarship.';
      btn.disabled = true;
    }
  }
  sel.addEventListener('change', check);
  gwa.addEventListener('input', check);
  failed.addEventListener('input', check);
  check();
})();
</script>
{% endblock %}
